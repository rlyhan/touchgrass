name: Keep Render API warm

on:
  schedule:
    # Every 10 minutes. GitHub Actions cron is best-effort and frequently delayed
    # by 5–15 minutes during high load; 10 min gives margin against Render's
    # ~15 min idle-shutdown.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            https://touchgrass-api-81dp.onrender.com/health
