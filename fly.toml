# Fly.io config for the touchgrass API — QA environment.
#
# First-time setup:
#   brew install flyctl
#   fly auth login
#   fly apps create touchgrass-api-qa        # register the app name
#   fly secrets set \
#     DATABASE_URL="..." \
#     BETTER_AUTH_SECRET="..." \
#     BETTER_AUTH_URL="https://touchgrass-api-qa.fly.dev" \
#     BETTER_AUTH_TRUSTED_ORIGINS="exp+touchgrass://,https://touchgrass-mobile-qa.vercel.app" \
#     SANITY_PROJECT_ID="..." \
#     SANITY_DATASET="..." \
#     SANITY_API_VERSION="..." \
#     --app touchgrass-api-qa
#
# Deploy:
#   fly deploy
#
# The web and mobile clients call this API directly (no Vercel proxy).
# Set EXPO_PUBLIC_API_BASE_URL=https://touchgrass-api-qa.fly.dev in:
#   - Vercel QA project environment variables (web)
#   - EAS "preview" environment (mobile)

app = "touchgrass-api-qa"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # "suspend" freezes the machine's memory to disk rather than doing a full
  # shutdown — machines resume in ~1–3 s vs a cold Node boot.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
